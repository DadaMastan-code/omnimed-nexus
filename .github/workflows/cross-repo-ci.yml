name: Cross-Repo CI — Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [reindex]           # triggered after any monitored repo pushes

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install uv && uv pip install --system -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Mypy type check
        run: mypy orchestrator/ github_app/ rag_layer/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]
      neo4j:
        image: neo4j:5.27
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports: ["7687:7687"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install uv && uv pip install --system -e ".[dev]"
      - name: Run tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QDRANT_HOST: localhost
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: testpassword
          GITHUB_TOKEN: ${{ secrets.OMNIMED_GITHUB_TOKEN }}
        run: pytest tests/ -v --tb=short

  reindex-knowledge-base:
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'reindex'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install uv && uv pip install --system -e .
      - name: Re-index changed repo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.OMNIMED_GITHUB_TOKEN }}
          QDRANT_HOST: ${{ secrets.QDRANT_HOST }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python - <<'EOF'
          import asyncio
          from rag_layer.indexer import index_repo
          import os, json

          source_repo = "${{ github.event.client_payload.source_repo }}"
          if source_repo:
              asyncio.run(index_repo(source_repo))
              print(f"Re-indexed: {source_repo}")
          else:
              from rag_layer.indexer import index_all_repos
              asyncio.run(index_all_repos())
              print("Full re-index complete")
          EOF
