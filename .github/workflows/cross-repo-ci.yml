name: Cross-Repo CI — Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [reindex]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check orchestrator/ github_app/ rag_layer/ graph_layer/ ml_registry/ eval_harness/

  install-and-test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports: ["7474:7474", "7687:7687"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install CPU-only torch via pip (isolated from project resolver)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project via uv (PyPI only — no index pollution from pytorch whl)
        run: uv pip install --system -e "." pytest pytest-asyncio

      - name: Verify imports
        run: python -c "import orchestrator, github_app, rag_layer, graph_layer, ml_registry, eval_harness; print('All packages OK')"

      - name: Run tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-placeholder' }}
          QDRANT_HOST: localhost
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: testpassword
          GITHUB_TOKEN: ${{ secrets.OMNIMED_GITHUB_TOKEN || '' }}
          CODESENSE_API_URL: http://localhost:8001
          MEDFUSION_API_URL: http://localhost:8002
          MEDBRAIN_API_URL: http://localhost:8003
          MLFLOW_TRACKING_URI: http://localhost:5001
        run: pytest tests/ -v --tb=short

  reindex-knowledge-base:
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'reindex'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.OMNIMED_GITHUB_TOKEN }}
      QDRANT_HOST: ${{ secrets.QDRANT_HOST }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install CPU torch + project
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -e .

      - name: Re-index changed repo
        run: |
          python - <<'EOF'
          import asyncio, os
          source_repo = os.environ.get("SOURCE_REPO", "")
          if source_repo:
              from rag_layer.indexer import index_repo
              asyncio.run(index_repo(source_repo))
              print(f"Re-indexed: {source_repo}")
          else:
              from rag_layer.indexer import index_all_repos
              asyncio.run(index_all_repos())
              print("Full re-index complete")
          EOF
