name: Cross-Repo CI — Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [reindex]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check orchestrator/ github_app/ rag_layer/ graph_layer/ ml_registry/ eval_harness/

  install-and-test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]
        options: >-
          --health-cmd "wget -qO- http://localhost:6333/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      neo4j:
        image: neo4j:5.27
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports: ["7474:7474", "7687:7687"]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install CPU-only torch (avoids 1.5GB CUDA download in CI)
        run: |
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project deps
        run: |
          uv pip install --system -e "." \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            pytest pytest-asyncio

      - name: Verify package imports
        run: |
          python -c "import orchestrator; import github_app; import rag_layer; import graph_layer; import ml_registry; import eval_harness; print('All packages import OK')"

      - name: Run tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-placeholder' }}
          QDRANT_HOST: localhost
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: testpassword
          GITHUB_TOKEN: ${{ secrets.OMNIMED_GITHUB_TOKEN || '' }}
          CODESENSE_API_URL: http://localhost:8001
          MEDFUSION_API_URL: http://localhost:8002
          MEDBRAIN_API_URL: http://localhost:8003
          MLFLOW_TRACKING_URI: http://localhost:5001
        run: |
          if [ -d tests ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests directory yet — skipping. Add tests/ to enable."
          fi

  reindex-knowledge-base:
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'reindex'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install CPU torch + project
        run: |
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -e . --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Re-index changed repo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.OMNIMED_GITHUB_TOKEN }}
          QDRANT_HOST: ${{ secrets.QDRANT_HOST }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python - <<'EOF'
          import asyncio, os
          source_repo = os.environ.get("SOURCE_REPO", "")
          if source_repo:
              from rag_layer.indexer import index_repo
              asyncio.run(index_repo(source_repo))
              print(f"Re-indexed: {source_repo}")
          else:
              from rag_layer.indexer import index_all_repos
              asyncio.run(index_all_repos())
              print("Full re-index complete")
          EOF
        env:
          SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
