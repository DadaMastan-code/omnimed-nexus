name: Self-Review — codesense-ai reviews all repos

on:
  schedule:
    - cron: "0 2 * * *"      # daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      repo:
        description: "Specific repo to review (leave blank for all)"
        required: false

jobs:
  review-all-repos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - DadaMastan-code/codesense-ai
          - DadaMastan-code/MedFusion-Leuk
          - DadaMastan-code/medbrain-ai

    steps:
      - name: Checkout omnimed-nexus
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv && uv pip install --system -e .

      - name: Run codesense-ai review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.OMNIMED_GITHUB_TOKEN }}
          CODESENSE_API_URL: ${{ secrets.CODESENSE_API_URL }}
          MEDFUSION_API_URL: ${{ secrets.MEDFUSION_API_URL }}
          MEDBRAIN_API_URL: ${{ secrets.MEDBRAIN_API_URL }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          QDRANT_HOST: ${{ secrets.QDRANT_HOST }}
        run: |
          python - <<'EOF'
          import asyncio
          from orchestrator.tools import review_pr_diff
          from orchestrator.memory import memory
          import httpx, json, os

          REPO = "${{ matrix.repo }}"
          TOKEN = os.environ["GITHUB_TOKEN"]

          async def main():
              await memory.connect()

              # Get recent commits to build review context
              async with httpx.AsyncClient() as client:
                  resp = await client.get(
                      f"https://api.github.com/repos/{REPO}/commits?per_page=10",
                      headers={"Authorization": f"Bearer {TOKEN}"}
                  )
                  commits = resp.json()

              if commits and isinstance(commits, list):
                  print(f"Reviewing {REPO} — {len(commits)} recent commits")
                  # Get latest diff
                  diff_resp = await client.get(
                      commits[0]["url"],
                      headers={"Authorization": f"Bearer {TOKEN}", "Accept": "application/vnd.github.diff"}
                  ) if False else None  # placeholder — real impl calls codesense API

              print(f"Scheduled review complete for {REPO}")
              await memory.close()

          asyncio.run(main())
          EOF

      - name: Dispatch reindex event
        env:
          GH_TOKEN: ${{ secrets.OMNIMED_GITHUB_TOKEN }}
        run: |
          gh api repos/DadaMastan-code/omnimed-nexus/dispatches \
            --method POST \
            --field event_type=reindex \
            --field "client_payload[source_repo]=${{ matrix.repo }}"
